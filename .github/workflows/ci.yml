name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}  # least privilege: CI only reads the repository
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: auditor, POSTGRES_PASSWORD: ci, POSTGRES_DB: auditor}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auditor" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm i -g pnpm@10
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run playwright install --with-deps chromium
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pytest -q -p no:cacheprovider
        working-directory: backend
        env: {A11Y_TEST_POSTGRES_URL: "postgresql+psycopg://auditor:ci@localhost:5432/auditor", A11Y_REQUIRE_POSTGRES: "1"}
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm i -g pnpm@10
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint && pnpm typecheck && pnpm build
        working-directory: frontend
      - name: generated API types are up to date
        run: |
          pip install uv && cd ../backend && uv sync --frozen && uv run python scripts/export_openapi.py ../frontend/openapi.json
          cd ../frontend && pnpm gen:api && git diff --exit-code openapi.json lib/api-types.ts
        working-directory: frontend
